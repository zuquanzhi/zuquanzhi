name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      # WAKATIME_API_KEY must contain a WakaTime OAuth token, not a plugin API key.
      - uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
